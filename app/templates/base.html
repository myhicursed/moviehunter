<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO: Заголовок и описание -->
    <title>{% block title %}МУВИХАНТЕР — Угадай фильм за 10 секунд{% endblock %}</title>
    <meta name="description"
        content="{% block description %}Угадай фильм по 10-секундному отрывку. Играй в киноквизы по жанрам, ежедневные челленджи. Бесплатно, без рекламы.{% endblock %}">
    <meta name="keywords"
        content="угадай фильм, киноквиз, фильм по отрывку, quiz movie, moviehunter, мувихантер, кино игра, угадай кино">
    <meta name="author" content="МУВИХАНТЕР">
    <link rel="canonical" href="{% block canonical %}https://moviehunter.ru{% endblock %}">

    <!-- Open Graph (для соцсетей: VK, Telegram, Facebook) -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="МУВИХАНТЕР">
    <meta property="og:title" content="{% block og_title %}МУВИХАНТЕР — Угадай фильм за 10 секунд{% endblock %}">
    <meta property="og:description"
        content="{% block og_description %}Угадай фильм по короткому видеоотрывку. Проверь, насколько хорошо ты знаешь кино!{% endblock %}">
    <meta property="og:image" content="https://moviehunter.ru/static/img/og-image.png">
    <meta property="og:url" content="{% block og_url %}https://moviehunter.ru{% endblock %}">
    <meta property="og:locale" content="ru_RU">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="МУВИХАНТЕР — Угадай фильм">
    <meta name="twitter:description" content="Угадай фильм по короткому отрывку!">
    <meta name="twitter:image" content="https://moviehunter.ru/static/img/og-image.png">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/static/img/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/img/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/img/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/img/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/static/img/android-chrome-512x512.png">

    <!-- Тема для мобильных браузеров -->
    <meta name="theme-color" content="#0a0a0a">

    <!-- Мгновенная проверка авторизации (антимигание) -->
    <script>
        (function () {
            if (localStorage.getItem('moviehunter_token')) {
                document.documentElement.classList.add('auth-loaded');
            }
        })();
    </script>

    <!-- Стили -->
    <style>
        /* Глобальный фон на body — плавный без артефактов */
        html {
            background-color: #0a0a0a;
        }

        body {
            background-color: #0a0a0a;
            background-image:
                radial-gradient(circle at 20% 20%, rgba(229, 9, 20, 0.12) 0, transparent 45%),
                radial-gradient(circle at 80% 70%, rgba(229, 9, 20, 0.08) 0, transparent 45%),
                linear-gradient(180deg, #0a0a0a 0%, #141414 50%, #0a0a0a 100%);
            min-height: 100vh;
        }

        /* Авторизация в шапке */
        #loginBtn {
            display: block;
        }

        #profileLink {
            display: none;
        }

        #tgLink {
            display: none;
        }

        html.auth-loaded #loginBtn {
            display: none;
        }

        html.auth-loaded #profileLink {
            display: flex;
        }

        html.auth-loaded #tgLink {
            display: inline-flex;
        }

        /* Главная страница: гость vs авторизованный */
        .guest-only {
            display: block;
        }

        .user-only {
            display: none;
        }

        html.auth-loaded .guest-only {
            display: none;
        }

        html.auth-loaded .user-only {
            display: block;
        }
    </style>

    <!-- Tailwind CSS через CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="/static/css/custom.css?v=2">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            DEFAULT: '#e50914',
                            dark: '#b20710',
                        },
                        dark: {
                            900: '#0a0a0a',
                            800: '#141414',
                            700: '#1f1f1f',
                            600: '#2d2d2d',
                        }
                    }
                }
            }
        }
    </script>

    <!-- Yandex.Metrika counter -->
    <script type="text/javascript">
            (function (m, e, t, r, i, k, a) {
                m[i] = m[i] || function () { (m[i].a = m[i].a || []).push(arguments) };
                m[i].l = 1 * new Date();
                for (var j = 0; j < document.scripts.length; j++) { if (document.scripts[j].src === r) { return; } }
                k = e.createElement(t), a = e.getElementsByTagName(t)[0], k.async = 1, k.src = r, a.parentNode.insertBefore(k, a)
            })(window, document, 'script', 'https://mc.yandex.ru/metrika/tag.js?id=111533824', 'ym');

        ym(111533824, 'init', { ssr: true, webvisor: true, clickmap: true, ecommerce: "dataLayer", referrer: document.referrer, url: location.href, accurateTrackBounce: true, trackLinks: true });
    </script>
    <noscript>
        <div><img src="https://mc.yandex.ru/watch/111533824" style="position:absolute; left:-9999px;" alt="" /></div>
    </noscript>
    <!-- /Yandex.Metrika counter -->
</head>

<body class="bg-dark-900 text-white min-h-screen font-sans flex flex-col overflow-x-hidden">

    <!-- Декоративные эмодзи на фоне -->
    <div class="fixed inset-0 pointer-events-none overflow-hidden" style="z-index: 0;">
        <div class="absolute top-20 left-10 text-9xl opacity-[0.07]">🎬</div>
        <div class="absolute bottom-40 right-10 text-9xl opacity-[0.07]">🎞️</div>
        <div class="absolute top-1/2 left-1/4 text-8xl opacity-[0.07]">🍿</div>
        <div class="absolute top-1/3 right-1/4 text-8xl opacity-[0.07]">🎥</div>
        <div class="absolute bottom-20 left-1/3 text-9xl opacity-[0.07]">🎭</div>
    </div>

    {% include "partials/header.html" %}

    <main class="flex-1 relative" style="z-index: 1;">
        {% block content %}{% endblock %}
    </main>

    {% include "partials/footer.html" %}

    {% include "partials/auth_modal.html" %}

    <!-- Общий JS для всех страниц -->
    <script src="/static/js/auth.js?v=2"></script>

    {% block scripts %}{% endblock %}

</body>

</html>
