<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>{% block title %}МУВИХАНТЕР — Угадай фильм за 10 секунд{% endblock %}</title>
    <!-- Иконки сайта -->
    <link rel="icon" type="image/x-icon" href="/static/img/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/img/favicon-16x16.png">

    <!-- Apple -->
    <link rel="apple-touch-icon" sizes="180x180" href="/static/img/apple-touch-icon.png">

    <!-- Android -->
    <link rel="icon" type="image/png" sizes="192x192" href="/static/img/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/static/img/android-chrome-512x512.png">

    <!-- Превью при отправке ссылки -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="МУВИХАНТЕР — Угадай фильм за 10 секунд">
    <meta property="og:description"
        content="Короткий отрывок, 4 варианта ответа. Проверь, насколько хорошо ты знаешь кино.">
    <meta property="og:image" content="https://moviehunter.ru/static/img/og-image.png">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="МУВИХАНТЕР — Угадай фильм за 10 секунд">
    <meta name="twitter:description"
        content="Короткий отрывок, 4 варианта ответа. Проверь, насколько хорошо ты знаешь кино.">
    <meta name="twitter:image" content="/static/img/og-image.png">
    <!-- ============================================
         РАННЯЯ ИНИЦИАЛИЗАЦИЯ
         ============================================ -->
    <script>
        (function () {
            /* Авторизация */
            try {
                if (localStorage.getItem('moviehunter_token')) {
                    document.documentElement.classList.add('auth-loaded');
                }
            } catch (e) {
                console.warn('localStorage недоступен:', e);
            }

            /*
             * Эффекты:
             * отсутствие настройки = ВКЛ
             * on = ВКЛ
             * off = ВЫКЛ
             *
             * Класс ставим на <html>, потому что body
             * на этом этапе ещё не создан.
             */
            try {
                if (localStorage.getItem('moviehunter_fx') === 'off') {
                    document.documentElement.classList.add('fx-disabled');
                }
            } catch (e) {
                /* Если localStorage недоступен — эффекты остаются включены */
            }
        })();
    </script>

    <style>
        /* ============================================
           БАЗА
           ============================================ */

        html,
        body {
            background-color: #050507;
            color: #ffffff;
            min-height: 100vh;
        }


        /* ============================================
           ФОНОВЫЕ ЗАСВЕТЫ
           ============================================ */

        .ambient-light-1 {
            position: fixed;
            top: -30%;
            left: -20%;
            width: 100vw;
            height: 100vw;

            background: radial-gradient(circle,
                    rgba(229, 9, 20, 0.2) 0%,
                    rgba(0, 0, 0, 0) 60%);

            z-index: 0;
            pointer-events: none;

            animation: cinemaLight 10s ease-in-out infinite;
        }

        .ambient-light-2 {
            position: fixed;
            bottom: -30%;
            right: -20%;
            width: 120vw;
            height: 120vw;

            background: radial-gradient(circle,
                    rgba(147, 51, 234, 0.15) 0%,
                    rgba(0, 0, 0, 0) 60%);

            z-index: 0;
            pointer-events: none;

            animation: cinemaLight 14s ease-in-out infinite reverse;
        }

        @keyframes cinemaLight {

            0%,
            100% {
                opacity: 0.7;
                transform: scale(1);
            }

            50% {
                opacity: 1;
                transform: scale(1.08);
            }
        }


        /* ============================================
           ПАРЯЩИЕ ЭМОДЗИ
           ============================================ */

        @keyframes floatUp {
            0% {
                transform: translateY(110vh) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 0.08;
            }

            90% {
                opacity: 0.08;
            }

            100% {
                transform: translateY(-20vh) rotate(360deg);
                opacity: 0;
            }
        }

        .floating-icon {
            position: fixed;
            z-index: 0;

            pointer-events: none;

            opacity: 0;
            font-size: 5rem;

            filter: blur(2px);

            animation: floatUp linear infinite;
        }

        .f-1 {
            left: 10%;
            animation-duration: 25s;
            animation-delay: 0s;
            font-size: 6rem;
        }

        .f-2 {
            left: 30%;
            animation-duration: 20s;
            animation-delay: 5s;
            font-size: 4rem;
        }

        .f-3 {
            left: 50%;
            animation-duration: 28s;
            animation-delay: 2s;
            font-size: 7rem;
        }

        .f-4 {
            left: 70%;
            animation-duration: 22s;
            animation-delay: 8s;
            font-size: 5rem;
        }

        .f-5 {
            left: 90%;
            animation-duration: 26s;
            animation-delay: 12s;
            font-size: 6rem;
        }

        .f-6 {
            left: 20%;
            animation-duration: 24s;
            animation-delay: 15s;
            font-size: 4.5rem;
        }

        .f-7 {
            left: 80%;
            animation-duration: 27s;
            animation-delay: 18s;
            font-size: 5.5rem;
        }


        /* ============================================
           АВТОРИЗАЦИЯ
           ============================================ */

        #loginBtn {
            display: block;
        }

        #profileLink,
        #tgLink {
            display: none;
        }

        html.auth-loaded #loginBtn {
            display: none !important;
        }

        html.auth-loaded #profileLink {
            display: flex !important;
        }

        html.auth-loaded #tgLink {
            display: inline-flex !important;
        }


        /* ============================================
           ГОСТЬ / АВТОРИЗОВАННЫЙ
           ============================================ */

        .user-only {
            display: none !important;
        }

        .guest-only {
            display: flex !important;
        }

        html.auth-loaded .guest-only {
            display: none !important;
        }

        html.auth-loaded .user-only {
            display: flex !important;
        }


        /* ============================================
           GLASS
           ============================================ */

        .glass-card {
            background: rgba(255, 255, 255, 0.03);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            border: 1px solid rgba(255, 255, 255, 0.06);

            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.3);

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease,
                background 0.3s ease,
                border-color 0.3s ease;
        }

        .glass-card:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.18);
            transform: translateY(-4px);
        }


        /* ============================================
           ЛОГОТИП
           ============================================ */

        .logo-glow {
            filter: drop-shadow(0 0 10px rgba(229, 9, 20, 0.6));
        }


        /* ============================================
           ЭФФЕКТЫ ВЫКЛЮЧЕНЫ
           Используем класс на HTML
           ============================================ */

        html.fx-disabled .floating-icon {
            display: none !important;
        }

        html.fx-disabled .ambient-light-1,
        html.fx-disabled .ambient-light-2 {
            display: none !important;
            animation: none !important;
            opacity: 0 !important;
        }

        html.fx-disabled .glass-card,
        html.fx-disabled .glass-card:hover {
            background: rgba(255, 255, 255, 0.03) !important;

            border-color:
                rgba(255, 255, 255, 0.06) !important;

            transform: none !important;

            transition: none !important;

            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.3) !important;
        }

        html.fx-disabled .glass-card *,
        html.fx-disabled .glass-card:hover * {
            transition: none !important;
            transform: none !important;
        }

        /*
         * Отключаем цветные overlay у карточек.
         */
        html.fx-disabled .glass-card>.absolute.inset-0 {
            opacity: 0 !important;
            transition: none !important;
        }

        html.fx-disabled .glass-card:hover>.absolute.inset-0 {
            opacity: 0 !important;
        }

        /*
         * Кнопка эффектов при отключенном состоянии.
         */
        /* Кнопка эффектов — включено */
        .toggle-fx-btn i {
            color: #e50914 !important;
            transition: color 0.2s ease;
        }

        /* Кнопка эффектов — выключено */
        html.fx-disabled .toggle-fx-btn i {
            color: rgb(75 85 99) !important;
        }

        html.fx-disabled .toggle-fx-btn {
            color: rgb(107 114 128);
        }
    </style>


    <!-- ============================================
         TAILWIND
         ============================================ -->

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']

                        brand: {
                            DEFAULT: '#e50914',
                            dark: '#b20710'

        };

    <!-- ============================================
         CSS / ИКОНКИ / ШРИФТЫ
         ============================================ -->

    <link rel="stylesheet" href="/static/css/custom.css?v=7">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
</head>


<body class="font-sans flex flex-col relative overflow-x-hidden bg-[#050507] min-h-screen">


    <!-- ============================================
         ФОН
         ============================================ -->

    <div class="ambient-light-1"></div>
    <div class="ambient-light-2"></div>


    <!-- ============================================
         ПАРЯЩИЕ ЭМОДЗИ
         ============================================ -->

    <div class="floating-icon f-1">🎬</div>
    <div class="floating-icon f-2">🍿</div>
    <div class="floating-icon f-3">🎥</div>
    <div class="floating-icon f-4">🎞️</div>
    <div class="floating-icon f-5">🎭</div>
    <div class="floating-icon f-6">🍿</div>
    <div class="floating-icon f-7">🎬</div>


    <!-- ============================================
         HEADER
         ============================================ -->

    {% include "partials/header.html" %}


    <!-- ============================================
         CONTENT
         ============================================ -->

    <main class="flex-1 relative z-10 flex flex-col">
        {% block content %}{% endblock %}
    </main>


    <!-- ============================================
         AUTH MODAL
         ============================================ -->

    {% include "partials/auth_modal.html" %}


    <!-- ============================================
         ЭФФЕКТЫ
         ============================================ -->

    <script>
        (function () {
            const FX_KEY = 'moviehunter_fx';

            /*
             * Получаем состояние.
             *
             * Только "off" означает выключенные эффекты.
             * Во всех остальных случаях они включены.
             */
            function getFxEnabled() {
                try {
                    return localStorage.getItem(FX_KEY) !== 'off';
                } catch (error) {
                    return true;
                }
            }


            /*
             * Сохраняем состояние.
             */
            function saveFxState(enabled) {
                try {
                    localStorage.setItem(
                        FX_KEY,
                        enabled ? 'on' : 'off'
                    );
                } catch (error) {
                    console.warn(
                        'Не удалось сохранить состояние эффектов:',
                        error
                    );
                }
            }


            /*
             * Обновляем текст обеих кнопок.
             */
            function updateFxButtons(enabled) {
                document
                    .querySelectorAll('.toggle-fx-btn')
                    .forEach(function (button) {

                        const text = button.querySelector('.fx-text');

                        if (text) {
                            text.textContent = enabled
                                ? 'Эффекты: ВКЛ'
                                : 'Эффекты: ВЫКЛ';
                        }

                        button.setAttribute(
                            'aria-pressed',
                            enabled ? 'true' : 'false'
                        );
                    });
            }


            /*
             * Применяем состояние.
             */
            function applyFxState(enabled) {
                document.documentElement.classList.toggle(
                    'fx-disabled',
                    !enabled
                );

                updateFxButtons(enabled);
            }


            /*
             * Инициализация кнопок.
             */
            function initFx() {
                /*
                 * Назначаем обработчики обеим кнопкам.
                 */
                document
                    .querySelectorAll('.toggle-fx-btn')
                    .forEach(function (button) {

                        if (button.dataset.fxInitialized === '1') {
                            return;
                        }

                        button.dataset.fxInitialized = '1';

                        button.addEventListener(
                            'click',
                            function (event) {
                                event.preventDefault();
                                event.stopPropagation();

                                const currentlyEnabled =
                                    !document.documentElement
                                        .classList
                                        .contains('fx-disabled');

                                const newState = !currentlyEnabled;

                                saveFxState(newState);
                                applyFxState(newState);
                            }
                        );
                    });

                /*
                 * После назначения обработчиков обязательно
                 * синхронизируем обе кнопки с localStorage.
                 */
                applyFxState(getFxEnabled());
            }


            if (document.readyState === 'loading') {
                document.addEventListener(
                    'DOMContentLoaded',
                    initFx,
                    { once: true }
                );
            } else {
                initFx();
            }

            window.addEventListener('load', function () {
                applyFxState(getFxEnabled());
            });


            /*
             * Оставляем функцию доступной для отладки.
             */
            window.MovieHunterFX = {
                enable: function () {
                    saveFxState(true);
                    applyFxState(true);
                },

                disable: function () {
                    saveFxState(false);
                    applyFxState(false);
                },

                reset: function () {
                    try {
                        localStorage.removeItem(FX_KEY);
                    } catch (error) {
                        /* ignore */
                    }

                    applyFxState(true);
                },

                getState: function () {
                    return getFxEnabled();
                }
            };
        })();
    </script>


    <!-- ============================================
         AUTH
         ============================================ -->

    <script src="/static/js/auth.js?v=6"></script>


    <!-- ============================================
         PAGE SCRIPTS
         ============================================ -->

    {% block scripts %}{% endblock %}

</body>

</html>
