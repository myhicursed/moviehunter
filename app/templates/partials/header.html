<header class="fixed top-0 left-0 right-0 z-50 bg-gradient-to-b from-dark-900 to-transparent">
    <nav class="container mx-auto px-6 py-4 flex items-center justify-between gap-4">
        <!-- Логотип -->
        <a href="/" class="flex items-center gap-3 group">
            <span class="text-3xl font-black tracking-tighter text-brand logo-glow">
                МУВИ<span class="text-white">ХАНТЕР</span>
            </span>
        </a>

        <!-- Правая часть -->
        <div class="flex items-center gap-2 md:gap-3">

            <!-- Кнопка Telegram-канала -->
            <a id="tgLink" href="https://t.me/moviehunterquiz" target="_blank" rel="noopener noreferrer"
                class="hidden items-center justify-center gap-2 h-10 w-10 sm:w-auto sm:px-4 bg-blue-500/10 hover:bg-blue-500/20 border border-blue-500/30 hover:border-blue-500/60 transition-all duration-300 rounded-lg font-bold text-sm shadow-[0_0_15px_rgba(59,130,246,0.15)] hover:shadow-[0_0_20px_rgba(59,130,246,0.3)] backdrop-blur-md"
                title="Наш Telegram-канал">
                <i class="fa-brands fa-telegram text-blue-500"></i>
                <span class="hidden sm:inline text-white">Мы в TG</span>
            </a>

            <!-- Кнопка "Поддержать" -->
            <a href="/support"
                class="inline-flex items-center justify-center gap-2 h-10 w-10 sm:w-auto sm:px-4 bg-brand/10 hover:bg-brand/20 border border-brand/30 hover:border-brand/60 transition-all duration-300 rounded-lg font-bold text-sm shadow-[0_0_15px_rgba(229,9,20,0.15)] hover:shadow-[0_0_20px_rgba(229,9,20,0.3)] backdrop-blur-md"
                title="Поддержать проект">
                <i class="fa-solid fa-heart text-brand"></i>
                <span class="hidden sm:inline text-white">Поддержать</span>
            </a>

            <!-- Кнопка "Войти" (для гостей) -->
            <button id="loginBtn"
                class="hidden md:block px-6 py-2 bg-brand hover:bg-brand-dark transition rounded-md font-semibold">
                Войти
            </button>

            <!-- Профиль (для авторизованных) — КРАСИВАЯ КЛИКАБЕЛЬНАЯ ПЛАШКА -->
            <a id="profileLink" href="/profile"
                class="hidden items-center gap-3 glass-card px-3 py-1.5 rounded-xl hover:bg-white/10 transition-all duration-300 border border-white/10 hover:border-white/20 group">
                <img id="userAvatar" src="/static/avatars/default.png" alt="Аватар"
                    class="w-8 h-8 rounded-full border border-brand object-cover">
                <span id="userName"
                    class="font-bold text-sm text-white group-hover:text-brand transition-colors"></span>
                <i
                    class="fa-solid fa-chevron-right text-[10px] text-gray-500 group-hover:text-brand transition-colors"></i>
            </a>
        </div>
    </nav>
</header>
