<header class="fixed top-0 left-0 right-0 z-50
           bg-gradient-to-b from-[#050507]/95 via-[#050507]/85 to-transparent
           backdrop-blur-md">

    <nav class="container mx-auto
               px-3 sm:px-6
               h-16 sm:h-[72px]
               flex items-center justify-between
               gap-2">

        <!-- ЛОГОТИП -->
        <a href="/" class="flex items-center min-w-0 flex-shrink group">

            <span class="text-[19px] min-[360px]:text-xl sm:text-3xl
                       font-black tracking-tighter
                       text-brand logo-glow
                       whitespace-nowrap">

                МУВИ<span class="text-white">ХАНТЕР</span>
            </span>

        </a>


        <!-- ПРАВАЯ ЧАСТЬ -->
        <div class="flex items-center justify-end
                   gap-1.5 sm:gap-2
                   flex-shrink-0">


            <!-- TELEGRAM -->
            <a id="tgLink" href="https://t.me/moviehunterquiz" target="_blank" rel="noopener noreferrer"
                title="Наш Telegram-канал" aria-label="Наш Telegram-канал" class="hidden
                       items-center justify-center
                       gap-2
                       h-9 sm:h-10
                       w-9 sm:w-auto
                       sm:px-4
                       rounded-lg
                       bg-blue-500/10
                       hover:bg-blue-500/20
                       border border-blue-500/30
                       hover:border-blue-500/60
                       transition-all duration-300
                       font-bold text-sm
                       backdrop-blur-md">

                <i class="fa-brands fa-telegram text-blue-400 text-base"></i>

                <span class="hidden sm:inline text-white">
                    Мы в TG
                </span>

            </a>


            <!-- ПОДДЕРЖАТЬ -->
            <a href="/support" title="Поддержать проект" aria-label="Поддержать проект" class="inline-flex
                       items-center justify-center
                       gap-2
                       h-9 sm:h-10
                       w-9 sm:w-auto
                       sm:px-4
                       rounded-lg
                       bg-brand/10
                       hover:bg-brand/20
                       border border-brand/30
                       hover:border-brand/60
                       transition-all duration-300
                       font-bold text-sm
                       backdrop-blur-md">

                <i class="fa-solid fa-heart text-brand text-sm sm:text-base"></i>

                <span class="hidden sm:inline text-white">
                    Поддержать
                </span>

            </a>


            <!-- ВОЙТИ -->
            <button id="loginBtn" type="button" class="hidden
                       flex-shrink-0
                       h-9 sm:h-10
                       px-3 sm:px-5
                       rounded-lg
                       bg-brand
                       hover:bg-brand-dark
                       transition
                       font-semibold
                       text-xs sm:text-sm
                       whitespace-nowrap">

                Войти

            </button>


            <!-- ПРОФИЛЬ -->
            <a id="profileLink" href="/profile" title="Мой профиль" aria-label="Мой профиль" class="hidden
                       flex-shrink-0
                       items-center justify-center
                       sm:justify-start
                       sm:gap-2
                       h-9 sm:h-10
                       w-9 sm:w-auto
                       sm:max-w-[200px]
                       p-1 sm:pl-1 sm:pr-3
                       rounded-lg sm:rounded-xl
                       glass-card
                       border border-white/10
                       hover:border-brand/40
                       hover:bg-white/10
                       transition-all duration-300
                       group">


                <!-- АВАТАР -->
                <img id="userAvatar" src="/static/avatars/default.png" alt="Аватар" class="w-7 h-7 sm:w-8 sm:h-8
                           rounded-md sm:rounded-full
                           border border-brand/70
                           object-cover
                           flex-shrink-0">


                <!-- НИК ТОЛЬКО НА SM+ -->
                <span id="userName" class="hidden sm:block
                           min-w-0 max-w-[120px]
                           truncate
                           font-bold
                           text-sm
                           text-white
                           group-hover:text-brand
                           transition-colors">
                </span>


                <!-- СТРЕЛКА ТОЛЬКО НА SM+ -->
                <i class="hidden sm:block
                           fa-solid fa-chevron-right
                           text-[10px]
                           text-gray-500
                           group-hover:text-brand
                           transition-colors
                           flex-shrink-0">
                </i>

            </a>

        </div>

    </nav>

</header>
