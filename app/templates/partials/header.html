<header
    class="fixed top-0 left-0 right-0 z-50 bg-gradient-to-b from-[#050507]/95 via-[#050507]/80 to-transparent backdrop-blur-sm">
    <nav class="container mx-auto px-3 sm:px-6 py-3 sm:py-4 flex items-center justify-between gap-2">

        <!-- ЛОГОТИП -->
        <a href="/" class="flex items-center min-w-0 flex-shrink group">
            <span
                class="text-xl min-[360px]:text-2xl sm:text-3xl font-black tracking-tighter text-brand logo-glow whitespace-nowrap">
                МУВИ<span class="text-white">ХАНТЕР</span>
            </span>
        </a>


        <!-- ПРАВАЯ ЧАСТЬ -->
        <div class="flex items-center justify-end gap-1.5 sm:gap-2 md:gap-3 min-w-0 flex-shrink">


            <!-- TELEGRAM -->
            <a id="tgLink" href="https://t.me/moviehunterquiz" target="_blank" rel="noopener noreferrer" class="hidden flex-shrink-0 items-center justify-center gap-2
                       h-9 w-9 sm:h-10 sm:w-auto sm:px-4
                       bg-blue-500/10 hover:bg-blue-500/20
                       border border-blue-500/30 hover:border-blue-500/60
                       transition-all duration-300 rounded-lg
                       font-bold text-sm
                       shadow-[0_0_15px_rgba(59,130,246,0.15)]
                       hover:shadow-[0_0_20px_rgba(59,130,246,0.3)]
                       backdrop-blur-md" title="Наш Telegram-канал" aria-label="Наш Telegram-канал">

                <i class="fa-brands fa-telegram text-blue-500"></i>

                <span class="hidden sm:inline text-white">
                    Мы в TG
                </span>
            </a>


            <!-- ПОДДЕРЖАТЬ -->
            <a href="/support" class="inline-flex flex-shrink-0 items-center justify-center gap-2
                       h-9 w-9 sm:h-10 sm:w-auto sm:px-4
                       bg-brand/10 hover:bg-brand/20
                       border border-brand/30 hover:border-brand/60
                       transition-all duration-300 rounded-lg
                       font-bold text-sm
                       shadow-[0_0_15px_rgba(229,9,20,0.15)]
                       hover:shadow-[0_0_20px_rgba(229,9,20,0.3)]
                       backdrop-blur-md" title="Поддержать проект" aria-label="Поддержать проект">

                <i class="fa-solid fa-heart text-brand"></i>

                <span class="hidden sm:inline text-white">
                    Поддержать
                </span>
            </a>


            <!-- ВОЙТИ -->
            <button id="loginBtn" type="button" class="hidden flex-shrink-0
                       h-9 sm:h-10
                       px-3 sm:px-5
                       bg-brand hover:bg-brand-dark
                       transition rounded-lg
                       font-semibold
                       text-xs sm:text-sm
                       whitespace-nowrap">

                Войти
            </button>


            <!-- ПРОФИЛЬ -->
            <a id="profileLink" href="/profile" class="hidden items-center
                       min-w-0 max-w-[105px] min-[390px]:max-w-[135px] sm:max-w-[220px]
                       gap-1.5 sm:gap-2
                       glass-card
                       px-1.5 sm:px-3
                       py-1 sm:py-1.5
                       rounded-xl
                       hover:bg-white/10
                       transition-all duration-300
                       border border-white/10
                       hover:border-white/20
                       group">

                <img id="userAvatar" src="/static/avatars/default.png" alt="Аватар" class="w-7 h-7 sm:w-8 sm:h-8
                           flex-shrink-0 rounded-full
                           border border-brand object-cover">

                <span id="userName" class="min-w-0 truncate
                           font-bold text-[11px] sm:text-sm
                           text-white
                           group-hover:text-brand
                           transition-colors">
                </span>

                <i class="hidden sm:block
                           fa-solid fa-chevron-right
                           text-[10px] text-gray-500
                           group-hover:text-brand
                           transition-colors flex-shrink-0">
                </i>

            </a>

        </div>

    </nav>
</header>
