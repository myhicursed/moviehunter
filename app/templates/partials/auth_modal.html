<!-- Модалка авторизации -->
<div 
    id="authModal" 
    class="hidden fixed inset-0 z-[100] flex items-center justify-center bg-black/80 backdrop-blur-sm p-4"
>
    <div class="relative w-full max-w-md bg-dark-800 rounded-2xl shadow-2xl border border-dark-600">
        
        <!-- Кнопка закрыть -->
        <button 
            id="closeAuthModal" 
            class="absolute top-4 right-4 w-10 h-10 flex items-center justify-center rounded-full hover:bg-dark-700 transition text-gray-400 hover:text-white"
        >
            <i class="fa-solid fa-xmark text-xl"></i>
        </button>
        
        <div class="p-8">
            <!-- Заголовок -->
            <div class="text-center mb-6">
                <h2 id="authModalTitle" class="text-3xl font-black">
                    Вход
                </h2>
                <p class="text-gray-400 mt-2 text-sm">
                    <span id="authModalSubtitle">Играй и сохраняй свои результаты</span>
                </p>
            </div>
            
            <!-- Форма (одна на всё) -->
            <form id="authForm" class="space-y-4">
                <!-- Ошибка -->
                <div id="authError" class="hidden bg-red-500/20 border border-red-500 text-red-300 px-4 py-3 rounded-lg text-sm">
                </div>
                
                <!-- Username -->
                <div>
                    <label class="block text-sm text-gray-400 mb-2">Ник</label>
                    <input 
                        type="text" 
                        id="authUsername" 
                        required
                        minlength="3"
                        maxlength="50"
                        class="w-full px-4 py-3 bg-dark-700 border border-dark-600 rounded-lg focus:border-brand focus:outline-none transition"
                        placeholder="Твой никнейм"
                    >
                </div>
                
                <!-- Password -->
                <div>
                    <label class="block text-sm text-gray-400 mb-2">Пароль</label>
                    <input 
                        type="password" 
                        id="authPassword" 
                        required
                        minlength="6"
                        maxlength="72"
                        class="w-full px-4 py-3 bg-dark-700 border border-dark-600 rounded-lg focus:border-brand focus:outline-none transition"
                        placeholder="Минимум 6 символов"
                    >
                </div>
                
                <!-- Кнопка отправки -->
                <button 
                    type="submit"
                    id="authSubmitBtn"
                    class="w-full py-3 bg-brand hover:bg-brand-dark transition rounded-lg font-bold text-lg shadow-lg shadow-brand/30 disabled:opacity-50 disabled:cursor-not-allowed"
                >
                    Войти
                </button>
            </form>
            
            <!-- Переключение режима -->
            <div class="text-center mt-6 text-sm text-gray-400">
                <span id="authSwitchText">Ещё нет аккаунта?</span>
                <button 
                    id="authSwitchBtn"
                    class="text-brand hover:underline font-semibold ml-1"
                >
                    Зарегистрироваться
                </button>
            </div>
        </div>
    </div>
</div>
