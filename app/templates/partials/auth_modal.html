<!-- ============================================ -->
<!-- МОДАЛКА АВТОРИЗАЦИИ                          -->
<!-- ============================================ -->

<div id="authModal" class="hidden fixed inset-0 z-[1000]
           flex items-center justify-center
           bg-black/80 backdrop-blur-sm
           p-4">

    <div class="relative
               w-full max-w-md
               bg-[#111116]
               rounded-2xl
               shadow-2xl
               border border-white/10
               overflow-hidden">


        <!-- КНОПКА ЗАКРЫТЬ -->
        <button id="closeAuthModal" type="button" aria-label="Закрыть" class="absolute
                   top-4 right-4
                   z-10
                   w-10 h-10
                   flex items-center justify-center
                   rounded-full
                   bg-white/5
                   hover:bg-white/10
                   text-gray-400
                   hover:text-white
                   transition">

            <i class="fa-solid fa-xmark text-xl"></i>

        </button>


        <div class="p-6 sm:p-8">


            <!-- ============================================ -->
            <!-- ЗАГОЛОВОК                                    -->
            <!-- ============================================ -->

            <div class="text-center mb-6 px-8">

                <h2 id="authModalTitle" class="text-2xl sm:text-3xl
                           font-black text-white">

                    Вход

                </h2>

                <p class="text-gray-400 mt-2 text-sm">

                    <span id="authModalSubtitle">
                        Играй и сохраняй свои результаты
                    </span>

                </p>

            </div>


            <!-- ============================================ -->
            <!-- ФОРМА                                        -->
            <!-- ============================================ -->

            <form id="authForm" class="space-y-4">


                <!-- ОШИБКА -->
                <div id="authError" class="hidden
                           bg-red-500/20
                           border border-red-500/50
                           text-red-300
                           px-4 py-3
                           rounded-lg
                           text-sm">
                </div>


                <!-- ============================================ -->
                <!-- НИК                                          -->
                <!-- ============================================ -->

                <div>

                    <label for="authUsername" class="block
                               text-sm
                               text-gray-400
                               mb-2">

                        Ник

                    </label>


                    <input type="text" id="authUsername" name="username" required minlength="3" maxlength="50"
                        autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Твой никнейм"
                        class="auth-input
                               w-full
                               px-4 py-3
                               bg-white/5
                               border border-white/10
                               rounded-xl
                               text-white
                               placeholder:text-gray-600
                               focus:border-brand
                               focus:ring-2
                               focus:ring-brand/20
                               focus:outline-none
                               transition">

                </div>


                <!-- ============================================ -->
                <!-- ПАРОЛЬ                                       -->
                <!-- ============================================ -->

                <div>

                    <label for="authPassword" class="block
                               text-sm
                               text-gray-400
                               mb-2">

                        Пароль

                    </label>


                    <input type="password" id="authPassword" name="password" required minlength="6" maxlength="72"
                        autocomplete="current-password" placeholder="Минимум 6 символов" class="auth-input
                               w-full
                               px-4 py-3
                               bg-white/5
                               border border-white/10
                               rounded-xl
                               text-white
                               placeholder:text-gray-600
                               focus:border-brand
                               focus:ring-2
                               focus:ring-brand/20
                               focus:outline-none
                               transition">

                </div>


                <!-- ============================================ -->
                <!-- КНОПКА ВХОДА                                 -->
                <!-- ============================================ -->

                <button type="submit" id="authSubmitBtn" class="w-full
                           py-3
                           bg-brand
                           hover:bg-brand-dark
                           rounded-xl
                           font-bold
                           text-base sm:text-lg
                           text-white
                           shadow-lg shadow-brand/20
                           transition
                           disabled:opacity-50
                           disabled:cursor-not-allowed">

                    Войти

                </button>

            </form>


            <!-- ============================================ -->
            <!-- ПЕРЕКЛЮЧЕНИЕ ВХОД / РЕГИСТРАЦИЯ             -->
            <!-- ============================================ -->

            <div class="text-center
                       mt-6
                       text-sm
                       text-gray-400">

                <span id="authSwitchText">
                    Ещё нет аккаунта?
                </span>


                <button type="button" id="authSwitchBtn" class="text-brand
                           hover:text-red-400
                           hover:underline
                           font-semibold
                           ml-1
                           transition">

                    Зарегистрироваться

                </button>

            </div>

        </div>

    </div>

</div>


<!-- ============================================ -->
<!-- СТИЛИ ПОЛЕЙ                                  -->
<!-- ============================================ -->

<style>
    /*
     * Обычный ввод
     */
    .auth-input {
        color: #ffffff !important;

        -webkit-text-fill-color: #ffffff !important;

        caret-color: #e50914 !important;
    }


    /*
     * Placeholder
     */
    .auth-input::placeholder {
        color: #4b5563 !important;

        -webkit-text-fill-color: #4b5563 !important;

        opacity: 1;
    }


    /*
     * Autofill:
     * Chrome / Chromium / Яндекс Браузер
     */
    .auth-input:-webkit-autofill,
    .auth-input:-webkit-autofill:hover,
    .auth-input:-webkit-autofill:focus,
    .auth-input:-webkit-autofill:active {

        -webkit-text-fill-color: #ffffff !important;

        caret-color: #e50914 !important;

        -webkit-box-shadow:
            0 0 0 1000px #15151b inset !important;

        box-shadow:
            0 0 0 1000px #15151b inset !important;

        border-color:
            rgba(255, 255, 255, 0.1) !important;

        transition:
            background-color 9999s ease-out 0s;
    }


    /*
     * Focus
     */
    .auth-input:focus {
        color: #ffffff !important;

        -webkit-text-fill-color: #ffffff !important;
    }


    /*
     * Выделение текста
     */
    .auth-input::selection {
        background:
            rgba(229, 9, 20, 0.45);

        color: #ffffff;
    }
</style>
