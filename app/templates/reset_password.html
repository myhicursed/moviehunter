{% extends "base.html" %}

{% block title %}Сброс пароля | МУВИХАНТЕР{% endblock %}

{% block content %}
<div class="pt-24 pb-20 min-h-[80vh] flex flex-col items-center justify-center">

    <div
        class="w-full max-w-md bg-[#111116] rounded-3xl p-6 sm:p-10 border border-white/10 shadow-2xl relative overflow-hidden">

        <!-- Декоративное свечение -->
        <div class="absolute -top-20 -right-20 w-40 h-40 bg-brand/20 blur-3xl rounded-full pointer-events-none"></div>

        <div class="text-center mb-8 relative z-10">
            <div
                class="w-16 h-16 mx-auto mb-4 rounded-full bg-brand/10 flex items-center justify-center border border-brand/20">
                <i class="fa-solid fa-unlock-keyhole text-brand text-2xl"></i>
            </div>
            <h1 class="text-2xl sm:text-3xl font-black text-white">Новый пароль</h1>
            <p class="text-gray-400 text-sm mt-2">Придумай надежный пароль для аккаунта</p>
        </div>

        <form id="resetForm" class="space-y-4 relative z-10">
            <!-- Скрытый токен из URL -->
            <input type="hidden" id="resetToken" value="{{ token }}">

            <div id="resetMsgBox" class="hidden border px-4 py-3 rounded-lg text-sm text-center font-medium"></div>

            <div>
                <label for="newPassword" class="block text-sm text-gray-400 mb-2">Новый пароль</label>
                <div class="relative">
                    <input type="password" id="newPassword" required minlength="6" maxlength="72"
                        placeholder="Минимум 6 символов"
                        class="auth-input w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:border-brand focus:outline-none transition pr-12">

                    <button type="button"
                        class="toggle-password absolute right-3 top-1/2 -translate-y-1/2 w-8 h-8 flex items-center justify-center text-gray-500 hover:text-white transition"
                        data-target="newPassword">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <div>
                <label for="confirmPassword" class="block text-sm text-gray-400 mb-2">Повтори пароль</label>
                <div class="relative">
                    <input type="password" id="confirmPassword" required minlength="6" maxlength="72"
                        placeholder="Пароли должны совпадать"
                        class="auth-input w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:border-brand focus:outline-none transition pr-12">

                    <button type="button"
                        class="toggle-password absolute right-3 top-1/2 -translate-y-1/2 w-8 h-8 flex items-center justify-center text-gray-500 hover:text-white transition"
                        data-target="confirmPassword">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" id="resetSubmitBtn"
                class="w-full mt-4 py-3 bg-brand hover:bg-brand-dark rounded-xl font-bold text-lg text-white shadow-lg shadow-brand/20 transition disabled:opacity-50">
                Сохранить и войти
            </button>
        </form>

        <div id="resetSuccessBlock" class="hidden text-center relative z-10">
            <h2 class="text-xl font-bold text-green-400 mb-4">Пароль успешно изменен!</h2>
            <a href="/"
                class="inline-block w-full py-3 bg-white/10 hover:bg-white/20 transition rounded-xl font-bold text-white">
                На главную
            </a>
        </div>

    </div>
</div>

<style>
    .auth-input {
        color: #ffffff !important;
        -webkit-text-fill-color: #ffffff !important;
        caret-color: #e50914 !important;
    }

    .auth-input::placeholder {
        color: #4b5563 !important;
        opacity: 1;
    }
</style>

{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', () => {
        // Отправка формы сброса пароля
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('resetSubmitBtn');
            const msgBox = document.getElementById('resetMsgBox');
            const token = document.getElementById('resetToken').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            msgBox.classList.add('hidden');

            if (newPassword !== confirmPassword) {
                msgBox.textContent = 'Пароли не совпадают!';
                msgBox.className = 'px-4 py-3 rounded-lg text-sm text-center font-medium bg-red-500/20 border border-red-500/50 text-red-300';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Сохраняем...';

            try {
                const response = await fetch('/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token, new_password: newPassword })
                });

                if (!response.ok) {
                    const data = await response.json();
                    throw new Error(data.detail || 'Ошибка. Возможно ссылка устарела.');
                }

                document.getElementById('resetForm').classList.add('hidden');
                document.getElementById('resetSuccessBlock').classList.remove('hidden');

            } catch (err) {
                msgBox.textContent = err.message;
                msgBox.className = 'px-4 py-3 rounded-lg text-sm text-center font-medium bg-red-500/20 border border-red-500/50 text-red-300';
                btn.disabled = false;
                btn.textContent = 'Сохранить и войти';
            }
        });
    });
</script>
{% endblock %}
