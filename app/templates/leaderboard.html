{% extends "base.html" %}

{% block title %}Топ игроков — МУВИХАНТЕР{% endblock %}

{% block content %}
<div class="pt-24 pb-20 min-h-screen flex flex-col items-center">
    <div class="container mx-auto px-4 max-w-2xl">

        <!-- Заголовок -->
        <div class="text-center mb-10">
            <h1 class="text-4xl md:text-5xl font-black mb-2">
                Топ <span class="text-brand">игроков</span>
            </h1>
            <p class="text-gray-400 text-sm">
                Лучшие охотники за фильмами
            </p>
        </div>

        <!-- Список (заполняется через JS) -->
        <div id="leaderboardFull" class="space-y-3">
            <div class="text-center text-gray-500 py-10">
                <i class="fa-solid fa-spinner fa-spin text-3xl"></i>
            </div>
        </div>

        <div class="text-center mt-8">
            <a href="/"
                class="inline-flex items-center gap-2 px-6 py-3 bg-white/5 hover:bg-white/10 transition rounded-lg font-semibold border border-white/10">
                <i class="fa-solid fa-arrow-left"></i>
                Назад
            </a>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const container = document.getElementById('leaderboardFull');
        try {
            const response = await fetch('/api/leaderboard/?limit=50');
            if (!response.ok) throw new Error('Не удалось загрузить топ');

            const players = await response.json();

            if (players.length === 0) {
                container.innerHTML = `<div class="text-center text-gray-500 py-6">Пока никого 🎯</div>`;
                return;
            }

            const medals = ['🥇', '🥈', '🥉'];

            container.innerHTML = players.map((p, i) => {
                const medal = medals[i] || `<span class="text-gray-500">#${p.position}</span>`;

                // Выделяем топ-3 стилистически
                const bgClass = i < 3 ? 'bg-gradient-to-r from-brand/10 to-transparent border-brand/30' : 'glass-card';

                return `
                    <a href="/profile/${p.user_id}" class="flex items-center gap-4 p-4 rounded-xl transition hover:-translate-y-1 ${bgClass}">
                        <div class="text-2xl w-12 text-center font-black">${medal}</div>
                        <img src="/static/avatars/${p.avatar}.png" alt="${p.username}" class="w-12 h-12 rounded-full object-cover border-2 border-dark-600" onerror="this.src='/static/avatars/default.png'">
                        <div class="flex-1">
                            <div class="font-bold text-lg text-white">${p.username}</div>
                        </div>
                        <div class="text-right">
                            <div class="text-xl font-black text-brand">${p.total_points}</div>
                            <div class="text-[10px] text-gray-500 uppercase tracking-wider">очков</div>
                        </div>
                    </a>
                `;
            }).join('');
        } catch (err) {
            container.innerHTML = `<div class="text-center text-red-500 py-6">❌ ${err.message}</div>`;
        }
    });
</script>
{% endblock %}
